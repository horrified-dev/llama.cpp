<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">CPU and GPU timeline of a decode step</title>
<desc id="d">Schematic: in stock llama.cpp the CPU idles while the GPU runs the next layer; in this fork helper threads load the predicted experts during that time, so the next expert computation is shorter.</desc>
<rect width="760" height="440" rx="8" fill="#fcfcfb"/>
<text x="16.0" y="26.0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">CPU and GPU timeline of a decode step</text>
<text x="16.0" y="47.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">Schematic, not to scale: two consecutive MoE layers whose routed experts are in system RAM</text>
<text x="16.0" y="88.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">Stock llama.cpp</text>
<text x="156.0" y="117.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end" dominant-baseline="middle">GPU</text>
<line x1="166.0" y1="117.0" x2="736.0" y2="117.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="156.0" y="151.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end" dominant-baseline="middle">CPU compute threads</text>
<line x1="166.0" y1="151.0" x2="736.0" y2="151.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="156.0" y="185.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end" dominant-baseline="middle">Prefetch helpers</text>
<line x1="166.0" y1="185.0" x2="736.0" y2="185.0" stroke="#e1e0d9" stroke-width="1"/>
<rect x="166.0" y="138.0" width="169.0" height="26.0" rx="4" fill="#eb6834"/>
<text x="251.5" y="151.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">experts of layer L</text>
<rect x="337.0" y="104.0" width="126.2" height="26.0" rx="4" fill="#2a78d6"/>
<text x="401.1" y="117.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">mixer L+1</text>
<rect x="465.2" y="138.0" width="169.0" height="26.0" rx="4" fill="#eb6834"/>
<text x="550.8" y="151.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">experts of layer L+1</text>
<rect x="636.2" y="104.0" width="97.8" height="26.0" rx="4" fill="#2a78d6"/>
<text x="686.1" y="117.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">mixer L+2</text>
<text x="16.0" y="246.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">This fork</text>
<text x="156.0" y="275.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end" dominant-baseline="middle">GPU</text>
<line x1="166.0" y1="275.0" x2="736.0" y2="275.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="156.0" y="309.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end" dominant-baseline="middle">CPU compute threads</text>
<line x1="166.0" y1="309.0" x2="736.0" y2="309.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="156.0" y="343.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="end" dominant-baseline="middle">Prefetch helpers</text>
<line x1="166.0" y1="343.0" x2="736.0" y2="343.0" stroke="#e1e0d9" stroke-width="1"/>
<rect x="166.0" y="296.0" width="169.0" height="26.0" rx="4" fill="#eb6834"/>
<text x="251.5" y="309.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">experts of layer L</text>
<rect x="337.0" y="296.0" width="8.7" height="26.0" rx="4" fill="#9a9993"/>
<rect x="347.7" y="262.0" width="126.2" height="26.0" rx="4" fill="#2a78d6"/>
<text x="411.8" y="275.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">mixer L+1</text>
<rect x="347.7" y="330.0" width="126.2" height="26.0" rx="4" fill="#1baf7a"/>
<text x="411.8" y="343.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">load predicted</text>
<rect x="475.9" y="296.0" width="129.8" height="26.0" rx="4" fill="#eb6834"/>
<text x="541.8" y="309.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">experts of L+1</text>
<rect x="607.8" y="262.0" width="126.2" height="26.0" rx="4" fill="#2a78d6"/>
<text x="671.9" y="275.0" font-size="11.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="middle">mixer L+2</text>
<text x="343.7" y="334.0" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="end" dominant-baseline="middle">predict</text>
<text x="483.9" y="343.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">stops when the real experts are known</text>
<line x1="607.8" y1="309.0" x2="636.2" y2="309.0" stroke="#52514e" stroke-width="2"/>
<line x1="636.2" y1="300.0" x2="636.2" y2="318.0" stroke="#52514e" stroke-width="1"/>
<text x="642.2" y="309.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">time saved</text>
<text x="16.0" y="388.0" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="start" dominant-baseline="middle">mixer = the attention or Gated DeltaNet block of a layer, plus its shared expert and router, all on the GPU.</text>
<text x="16.0" y="406.0" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="start" dominant-baseline="middle">While it runs, the 16 compute cores idle. Helpers on their SMT siblings load the rows of the predicted experts</text>
<text x="16.0" y="424.0" font-size="11" font-weight="400" fill="#6f6e69" text-anchor="start" dominant-baseline="middle">into the shared caches, so the next expert matmuls wait less on DRAM.</text>
</svg>
